services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: asset_command
      POSTGRES_USER: asset_command
      POSTGRES_PASSWORD: asset_command_dev
    ports:
      - "5433:5432"
    volumes:
      - asset-command-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asset_command -d asset_command"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  asset-command-postgres: